// salvar
function salvar() {
  localStorage.setItem("jogos", JSON.stringify(jogos));
}

// carregar
function carregar() {
  let dados = localStorage.getItem("jogos");
  if (dados) jogos = JSON.parse(dados);
}

// funções
function toggleAssistido(id){
  let j = jogos.find(x => x.id === id);
  j.assistido = !j.assistido;
  salvar();
  render();
}

function toggleFavorito(id){
  let j = jogos.find(x => x.id === id);
  j.favorito = !j.favorito;
  salvar();
  render();
}

function darNota(id,n){
  let j = jogos.find(x => x.id === id);
  j.nota = n;
  salvar();
  render();
}

// RENDER PRINCIPAL (ORDENADO POR DIA)
function render(){

  let app = document.getElementById("app");
  let busca = document.getElementById("busca").value.toLowerCase().trim();

let lista = jogos.filter(j => {
  if (!busca) return true; // 🔥 ESSA LINHA É A CORREÇÃO

  return j.time1.toLowerCase().includes(busca) ||
         j.time2.toLowerCase().includes(busca);
});

  // ordenar
  lista.sort((a,b)=>{
    let [d1,h1]=a.data.split(" ");
    let [d2,h2]=b.data.split(" ");

    let da=new Date(`2026-${d1.split("/").reverse().join("-")}T${h1}`);
    let db=new Date(`2026-${d2.split("/").reverse().join("-")}T${h2}`);

    return da-db;
  });

  app.innerHTML="";

  let assistidos = jogos.filter(j=>j.assistido).length;
  document.getElementById("contador").innerText =
    `Assistidos: ${assistidos} / ${jogos.length}`;

  // agrupar por dia
  let grupos = {};

  lista.forEach(j=>{
    let dia=j.data.split(" ")[0];
    if(!grupos[dia]) grupos[dia]=[];
    grupos[dia].push(j);
  });

  // render
  Object.keys(grupos).forEach(dia=>{

    let h2=document.createElement("h2");
    h2.innerText="📅 "+dia;
    app.appendChild(h2);

    grupos[dia].forEach(j=>{

      let div=document.createElement("div");
      div.className="jogo";

      if(j.assistido) div.classList.add("assistido");
      if(j.favorito) div.classList.add("favorito");

      div.innerHTML=`
        <b>${j.time1} x ${j.time2}</b><br>
        🕒 ${j.data.split(" ")[1]}<br>

        <button onclick="toggleAssistido(${j.id})">
          ${j.assistido?"✅":"⬜"}
        </button>

        <button onclick="toggleFavorito(${j.id})">
          ${j.favorito?"⭐":"☆"}
        </button>

        <br>
        ${[1,2,3,4,5].map(n=>
          `<button onclick="darNota(${j.id},${n})">
            ${n<=j.nota?"⭐":"☆"}
          </button>`
        ).join("")}
      `;

      app.appendChild(div);
    });

  });
}

// iniciar
carregar();
render();

</script>
